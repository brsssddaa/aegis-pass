services:
  - type: web
    name: aegis-pass-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "Aegis Pass Cloud Server ready"
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: AEGIS_PIN
        value: "2026"
      - key: NODE_ENV
        value: production
