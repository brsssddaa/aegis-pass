services:
  - type: web
    name: aegis-pass-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: AEGIS_PIN
        value: "2026"
      - key: NODE_ENV
        value: production
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
